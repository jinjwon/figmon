name: Windows build

on:
  push:
    branches: [main]   # 태그는 release 이벤트에서 한 번만 (같은 파일을 두 번 올리다 충돌하지 않게)
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install pyinstaller pillow

      - name: Smoke test (source)
        run: python tools/win_smoketest.py source

      - name: Build Figmon.exe
        run: pyinstaller --noconfirm figmon.spec   # 안 쓰는 모듈·Tcl 데이터를 빼서 가볍게 (figmon.spec 참고)

      - name: Size
        shell: pwsh
        run: "'Figmon.exe: {0:N1} MB' -f ((Get-Item dist/Figmon.exe).Length / 1MB)"

      - name: Smoke test (exe)
        run: python tools/win_smoketest.py exe

      - name: Auto-update test (old version updates itself from the latest release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/win_smoketest.py update

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Figmon.exe -DestinationPath Figmon-Windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoketest
          path: smoketest/
      - uses: actions/upload-artifact@v4
        with:
          name: Figmon-Windows
          path: Figmon-Windows.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ github.event.release.tag_name }}" Figmon-Windows.zip --clobber
