<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Figmon Pet</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 데스크톱 펫 창(투명, 260x260) 안에 그려지는 화면. 창 이동은 FigmonPet.swift가 담당 */
:root{--type:#ff6b6b}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
body{font-family:Jua,-apple-system,sans-serif}
#stage{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#pet{transition:transform .15s}
#pet.flip{transform:scaleX(-1)}
#body{display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%}
.mon{image-rendering:pixelated;transform-origin:50% 100%;display:block}
.mon.art{image-rendering:auto}
.shadow{width:60px;height:10px;border-radius:50%;background:rgba(0,0,0,.22);margin-top:-4px}

/* 기본은 차분하게: 숨쉬기만, 움직일 때만 걸음 */
.m-work #body,.m-neutral #body,.m-ai #body{animation:breathe 3.2s ease-in-out infinite}
.m-break #body{animation:sway 4s ease-in-out infinite}
.m-warning #body{animation:tremble .5s ease-in-out infinite}
.m-penalty #body{animation:tremble .28s ease-in-out infinite;filter:saturate(.5) drop-shadow(0 0 8px #ff3150)}
.m-paused #body{animation:breathe 5s ease-in-out infinite;filter:grayscale(.5)}
.m-idle #body{animation:sleep 4.5s ease-in-out infinite;filter:brightness(.75)}
.walk #body{animation:step .46s ease-in-out infinite !important}
.run #body{animation:step .26s ease-in-out infinite !important}
.walk .shadow,.run .shadow{animation:shadowstep .46s ease-in-out infinite}
.run .shadow{animation-duration:.26s}
.grabbed #body{animation:dangle .6s ease-in-out infinite alternate !important}
.react #body{animation:squash .6s cubic-bezier(.3,.7,.4,1) !important}
.tickle #body{animation:wiggle .7s ease-in-out !important}
.notice #body{animation:notice .45s ease-out !important}
.turn #body{animation:turn .2s ease-out !important}
.land #body{animation:landing .4s ease-out !important}
.petting #body{animation:petting .7s ease-in-out !important}
.flying #body{animation:spin .45s linear infinite !important}
.surprised #body{animation:surprised .9s ease-out !important}
.evolving #body{animation:evoflash 3s steps(1) forwards !important}
@keyframes petting{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(1.08,.92) rotate(-5deg)}45%{transform:scale(.97,1.03) rotate(4deg)}70%{transform:scale(1.06,.94) rotate(-3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes surprised{0%{transform:scale(1.25,.7)}20%{transform:translateY(-18px) scale(.9,1.12)}40%{transform:translateY(0) scale(1.1,.9)}55%{transform:translateX(-4px) rotate(-6deg)}70%{transform:translateX(4px) rotate(6deg)}85%{transform:translateX(-2px) rotate(-3deg)}100%{transform:none}}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes sleep{50%{transform:scale(1.04,.95)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes step{0%,100%{transform:translateY(0) rotate(-2.5deg)}25%{transform:translateY(-3px) rotate(0)}50%{transform:translateY(0) rotate(2.5deg)}75%{transform:translateY(-3px) rotate(0)}}
@keyframes shadowstep{25%,75%{transform:scale(.88)}}
@keyframes dangle{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes squash{0%{transform:scale(1,1)}15%{transform:scale(1.18,.82)}45%{transform:translateY(-26px) scale(.9,1.1)}70%{transform:translateY(0) scale(1.12,.88)}85%{transform:scale(.97,1.03)}100%{transform:scale(1,1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg) scale(1.05)}35%{transform:rotate(10deg)}55%{transform:rotate(-8deg)}75%{transform:rotate(5deg)}}
@keyframes notice{30%{transform:translateY(-8px) scale(.96,1.04)}60%{transform:translateY(0) scale(1.04,.96)}}
@keyframes turn{50%{transform:scale(1.08,.92)}}
@keyframes landing{0%{transform:scale(1.2,.78)}50%{transform:scale(.95,1.06)}100%{transform:scale(1,1)}}
.dust{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(160,150,140,.55);pointer-events:none;animation:dust .7s ease-out forwards}
@keyframes dust{to{opacity:0;transform:translate(var(--dx),-6px) scale(2)}}
.heart{position:absolute;pointer-events:none;font-size:16px;animation:heart 1.1s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-56px) scale(1.1)}}
.mark{position:absolute;pointer-events:none;font:20px Jua,sans-serif;color:#ffcc33;text-shadow:0 1px 0 #0008;animation:mark .9s ease-out forwards}
@keyframes mark{0%{opacity:0;transform:translateY(6px) scale(.5)}25%{opacity:1;transform:translateY(0) scale(1.15)}80%{opacity:1}100%{opacity:0}}
@keyframes evoflash{0%,20%,40%,56%,68%,78%,86%,92%,97%{filter:brightness(0) invert(1) drop-shadow(0 0 14px #fff)}10%,30%,48%,62%,73%,82%,89%,95%{filter:none}100%{filter:none}}

.egg{width:46px;height:58px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:#fdf8ec;position:relative;box-shadow:inset -6px -5px 0 rgba(0,0,0,.08),0 0 0 2px rgba(0,0,0,.08)}
.egg i{position:absolute;border-radius:50%;background:var(--type)}
.egg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#bbb}
.m-work .egg{animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{20%{transform:rotate(-10deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}

#bubble{position:absolute;left:50%;transform:translateX(-50%) scale(.6);opacity:0;max-width:236px;width:max-content;
  background:#fff;color:#222;padding:7px 12px;border-radius:14px;font-size:13px;line-height:1.35;text-align:center;
  box-shadow:0 2px 0 rgba(0,0,0,.15),0 4px 14px rgba(0,0,0,.18);transition:opacity .2s,transform .2s;transform-origin:50% 100%;pointer-events:none}
#bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
#bubble.alert{background:#ff5d6c;color:#fff}
#bubble:after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:inherit;border-bottom:0}
#bubble:after{border-top-color:#fff}#bubble.alert:after{border-top-color:#ff5d6c}
.particle{position:absolute;pointer-events:none;font-size:15px;animation:rise 1.8s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-60px) scale(1.15)}}
.float{position:absolute;left:50%;font-size:17px;pointer-events:none;animation:floatup 1.5s ease-out forwards;text-shadow:0 1px 0 #0008,0 0 4px #0006;white-space:nowrap}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-50px)}}
/* 시스템 "동작 줄이기"를 켜면 흔들림·파티클·깜빡임을 끈다 */
@media (prefers-reduced-motion: reduce){
  #body,.egg,#pet{animation:none !important;transition:none !important}
  .particle,.float{display:none}
  .evolving #body{animation:none !important;opacity:.6}
  #bubble{transition:none}
}
</style>
</head>
<body>
<div id="bubble"></div>
<div id="stage"><div id="pet"><div id="body"></div></div><div class="shadow"></div></div>
<script>
const $ = s => document.querySelector(s);
const RAW = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon';
const ANI = id => `${RAW}/other/showdown/${id}.gif`;
const ART = id => `${RAW}/other/official-artwork/${id}.png`;
const TYPE = {grass:'#78C850', fire:'#F08030', water:'#6890F0'};
const post = m => { try { webkit.messageHandlers.pet.postMessage(m); } catch (e) {} };

let lastSummon = 0;
let S = null, prev = null, shownKey = null, mode = 'neutral', walking = false, evolving = false, offline = false;

/* ---------- Swift가 부르는 함수 ---------- */
// 방향 전환: 살짝 찌그러졌다 돌아옴 (기본 스프라이트는 왼쪽을 봄)
function petFace(d) {
  const p = $('#pet'), flip = d > 0;
  if (p.classList.contains('flip') !== flip) { p.classList.toggle('flip', flip); play('turn', 200); }
}
// 0 = 멈춤, 1 = 걷기, 2 = 달리기
function petWalk(v) {
  v = v === true ? 1 : v === false ? 0 : v;
  walking = v > 0;
  document.body.classList.toggle('walk', v === 1);
  document.body.classList.toggle('run', v === 2);
}
let clickTimes = [];
function petEvent(k) {
  const b = document.body;
  if (k === 'grabbed') { b.classList.add('grabbed'); say(pick(['으아아 내려줘~', '높다…!', '어디 가는 거야?']), 2000); }
  if (k === 'land') { b.classList.remove('grabbed'); play('land', 400); dust(4); say('착지!', 1200); }
  if (k === 'come') say('불렀어? 갈게!', 2000);
  if (k === 'hover' && !evolving && !walking) { play('notice', 450); mark('!'); }
  if (k === 'click') {
    const now = Date.now();
    clickTimes = clickTimes.filter(t => now - t < 1500).concat(now);
    if (clickTimes.length >= 3) {          // 여러 번 연달아 누르면 간지러워함
      play('tickle', 700); hearts(5); say(pick(['간지러워~ ㅋㅋㅋ', '그만그만~ 😆', '히히 간지럽다니까!']), 2200);
    } else {
      play('react', 600); hearts(mode === 'penalty' ? 0 : 3);
      if (mode === 'penalty') floatText('💢', '#ff6b7a');
      say(reactLine(), 3000);
    }
  }
  if (k === 'dashboard') say('대시보드 열게!', 1500);
  // 커서로 비비기 → 쓰다듬기 (반응만, 경험치 없음)
  if (k === 'pet' && !evolving) {
    play('petting', 700); hearts(2);
    if (!$('#bubble').classList.contains('show') || !petEvent.petting) say(pick(['쓰담쓰담~ 좋아 💕', '기분 좋아~ 😊', '헤헤 더 해줘!', '스르르… 행복해']), 2600);
    petEvent.petting = true; clearTimeout(petEvent.pt); petEvent.pt = setTimeout(() => petEvent.petting = false, 2600);
  }
  // 세게 던지기 → 날아갔다가 깜짝 놀람
  if (k === 'fly') { b.classList.remove('grabbed'); if (!calm()) b.classList.add('flying'); say(pick(['으아아아~!', '날 수 있다…?!', '살려줘어~']), 0, true); }
  if (k === 'surprised') {
    b.classList.remove('flying', 'grabbed'); play('surprised', 900); dust(5); mark('!?');
    setTimeout(() => { if (!calm()) floatText('💫', '#ffd84d'); }, 300);
    say(pick(['깜짝이야!! 😵', '어지러워~ 💫', '던지지 마아~ 😣', '휴… 살았다']), 3200);
  }
}
function reactLine() {
  if (!S || !S.pet) return '대시보드에서 파트너를 골라줘! (두 번 누르기)';
  const lines = {
    work: ['응? 나 불렀어? 😊', '쓰담쓰담 좋아!', '같이 힘내자!', statusLine()],
    neutral: ['헤헤, 반가워!', '놀아줄 거야?', statusLine()],
    break: ['같이 쉬자~', '간식 있어? 🍪'],
    warning: ['지금 그럴 때가 아니야!', '빨리 돌아가자!'],
    penalty: ['흥! 작업부터 해!', '쓰다듬어도 안 풀려 💢'],
    idle: ['으음… 깼어…', '돌아왔구나!'],
    paused: ['쉬는 중이지? 기다릴게', '다녀와~'],
    ai: ['AI 말고 나랑 놀자~', '스스로도 해보자!'],
  };
  return pick(lines[mode] || lines.neutral);
}

/* ---------- 말풍선 ---------- */
const pick = a => a[Math.floor(Math.random() * a.length)];
const LINES = {
  work: ['잘 되고 있어! ✨', '집중력 최고야', '옆에서 지켜보고 있을게 👀', '같이 크는 중!', '이 속도면 곧 진화해!', '휴식 잔고도 쌓이는 중 🍿', '물 한 잔 마셔가며 해!'],
  neutral: ['뭐 하는 중이야?', '작업 시작하면 같이 크자!', '심심해~'],
  ai: ['AI 찬스 쓰는 중!', '너무 의존하진 말자~', '네 머리도 믿어봐 🧠'],
  break: ['잠깐 쉬는 것도 좋아 🍿', '휴식 잔고 쓰는 중~', '잔고 다 쓰면 돌아가자!'],
  warning: ['휴식 잔고가 없어!!', '지금 돌아가면 봐줄게!'],
  penalty: ['경험치가 줄고 있어!! 😭', '작업으로 돌아가줘…', '레벨 떨어진단 말이야!'],
  idle: ['Zzz…', '쿨쿨… 돌아오면 깨워줘'],
  paused: ['일시정지 중 ⏸ 편하게 다녀와!', '기다리고 있을게~'],
  egg: ['(알이 꿈틀거린다…)', '(안에서 톡톡 소리가 난다)', '(따뜻해지고 있다)'],
};
let sayTimer;
function say(text, ms = 4000, alert = false) {
  const b = $('#bubble'); b.textContent = text; b.classList.toggle('alert', alert); b.classList.add('show');
  placeBubble(); clearTimeout(sayTimer);
  if (ms) sayTimer = setTimeout(() => b.classList.remove('show'), ms);
}
function statusLine() {
  const p = S.pet, min = p.min_to_evo;
  const t = Math.ceil(min || 0), left = min == null ? '최종 진화 완료!' : `진화까지 ${t >= 60 ? Math.floor(t / 60) + '시간 ' : ''}${t % 60}분`;
  return `${p.name} Lv.${p.level} · ${left}`;
}
const DAY_LINES = {morning: ['좋은 아침! ☀️ 오늘도 같이 크자'], noon: ['점심은 먹었어? 🍚'], evening: ['저녁 시간이야, 조금만 더!'], night: ['새벽이야… 무리하지 마 🌙']};
const daypart = (h = new Date().getHours()) => h >= 6 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'noon' : h >= 17 && h < 21 ? 'evening' : 'night';
function modeLine(m) {
  if (S && S.pet && S.pet.branch_pending && Math.random() < .5) return '진화할 수 있을 것 같아! 대시보드에서 골라줘 ✨';
  if ((m === 'work' || m === 'neutral') && Math.random() < .25) return pick(DAY_LINES[daypart()]);
  if (S && S.pet && S.pet.stage === 0 && (m === 'work' || m === 'neutral')) return pick(LINES.egg);
  if (m === 'warning') return `${Math.ceil(S.live.grace_left || 0)}초 안에 돌아가! ⚠️`;
  return pick(LINES[m] || LINES.neutral);
}

/* ---------- 연출 ---------- */
// 한 번만 재생되는 몸짓 (react, notice, turn, land …)
function play(cls, ms) {
  if (calm()) return;
  const b = document.body;
  ['react', 'tickle', 'notice', 'turn', 'land', 'petting', 'surprised'].forEach(c => b.classList.remove(c));
  void b.offsetWidth; b.classList.add(cls);
  clearTimeout(play.t); play.t = setTimeout(() => b.classList.remove(cls), ms);
}
function jump() { play('react', 600); }
function hearts(n) {
  if (calm()) { if (n) floatText('♥', '#ff8fa8'); return; }
  const r = petRect();
  for (let i = 0; i < n; i++) setTimeout(() => {
    const h = document.createElement('div'); h.className = 'heart'; h.textContent = pick(['♥', '💕', '♥']);
    h.style.color = '#ff7aa2'; h.style.left = (r.left + r.width / 2 - 8 + (Math.random() * 30 - 15)) + 'px'; h.style.top = (r.top + 6) + 'px';
    h.style.setProperty('--dx', (Math.random() * 70 - 35) + 'px');
    document.body.appendChild(h); setTimeout(() => h.remove(), 1150);
  }, i * 90);
}
function mark(t) {
  if (calm()) return;
  const r = petRect(), m = document.createElement('div'); m.className = 'mark'; m.textContent = t;
  m.style.left = (r.left + r.width / 2 + 6) + 'px'; m.style.top = (r.top - 24) + 'px';
  document.body.appendChild(m); setTimeout(() => m.remove(), 950);
}
function dust(n = 1) {
  if (calm()) return;
  const r = petRect();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'dust';
    const back = $('#pet').classList.contains('flip') ? -1 : 1;   // 진행 반대쪽 발 뒤로
    d.style.left = (r.left + r.width / 2 + back * (r.width / 3) + (Math.random() * 10 - 5)) + 'px';
    d.style.top = (r.bottom - 8) + 'px';
    d.style.setProperty('--dx', (back * (8 + Math.random() * 10)) + 'px');
    document.body.appendChild(d); setTimeout(() => d.remove(), 720);
  }
}
setInterval(() => { if (walking && !evolving) dust(document.body.classList.contains('run') ? 2 : 1); }, 420);
function floatText(t, color) {
  const f = document.createElement('div'); f.className = 'float'; f.textContent = t; f.style.color = color;
  f.style.top = (petRect().top - 6) + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1600);
}
function heart() { floatText(mode === 'penalty' ? '💢' : '♥', '#ff8fa8'); }
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function particle() {
  if (calm()) return;
  const em = {work: ['✨', '⭐'], break: ['🍿', '🎵'], penalty: ['💢', '💧'], warning: ['❗'], idle: ['💤'], ai: ['🧠', '🤖']}[mode];
  if (!em || evolving || Math.random() < .4) return;
  const r = petRect(), p = document.createElement('div'); p.className = 'particle'; p.textContent = pick(em);
  p.style.left = (r.left + r.width / 2 - 8 + (Math.random() * 60 - 30)) + 'px'; p.style.top = (r.top + 10) + 'px';
  document.body.appendChild(p); setTimeout(() => p.remove(), 1900);
}
function petRect() { return $('#body').getBoundingClientRect(); }
function placeBubble() { $('#bubble').style.bottom = (innerHeight - petRect().top + 8) + 'px'; }
function reportRect() {
  const r = petRect();
  post({type: 'rect', x: r.left - 8, y: r.top - 8, w: r.width + 16, h: r.height + 20});
  placeBubble();
}

/* ---------- 스프라이트 (진화 단계 + 레벨에 따라 크기가 자람) ---------- */
function scaleFor(p) {
  if (!p || !p.species) return (S && S.config.pet_size) || 1;
  // 레벨에 따라 조금씩 커짐 (Lv.0 1.25배 → Lv.40 이상 2.1배). 진화 단계 수와 상관없이 같은 규칙
  return (1.25 + 0.85 * Math.min(p.level, 40) / 40) * ((S && S.config.pet_size) || 1);
}
function draw() {
  const p = S && S.pet, body = $('#body');
  const key = p ? (p.species ? p.species[0] : 'egg') : 'none';
  const sc = scaleFor(p);
  if (key !== shownKey) {
    shownKey = key; body.innerHTML = '';
    if (p && p.species) {
      const img = new Image(); img.className = 'mon'; img.alt = '';
      img.onload = () => { sizeImg(img); reportRect(); };
      img.onerror = () => { img.onerror = null; img.classList.add('art'); img.src = ART(p.species[0]); };
      img.src = ANI(p.species[0]); body.appendChild(img);
    } else {
      const e = document.createElement('div'); e.className = 'egg';
      if (p) [[10, 12, 9], [28, 22, 7], [14, 34, 11], [32, 40, 6]].forEach(([x, y, s]) => {
        const i = document.createElement('i'); Object.assign(i.style, {left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px'}); e.appendChild(i);
      }); else e.innerHTML = '<b>?</b>';
      body.appendChild(e);
    }
  }
  const img = body.querySelector('img'); if (img && img.complete) sizeImg(img, sc);
  reportRect();
}
function sizeImg(img, sc = scaleFor(S && S.pet)) {
  // 애니메이션 GIF는 픽셀 그대로 키우고, 일러스트(대체 이미지)는 높이를 맞춘다
  if (img.classList.contains('art')) { img.style.height = Math.round(48 * sc) + 'px'; img.style.width = 'auto'; }
  else { img.style.width = Math.round(img.naturalWidth * sc) + 'px'; img.style.height = Math.round(img.naturalHeight * sc) + 'px'; }
}

/* ---------- 상태 폴링 ---------- */
async function poll() {
  try {
    S = await (await fetch('/api/state', {cache: 'no-store'})).json();
    if (offline) { offline = false; say('다시 연결됐어!', 2000); }
  } catch (e) {
    if (!offline) { offline = true; say('Figmon 서버가 꺼져 있어… 💤', 0); }
    return;
  }
  const p = S.pet, m = S.live.mode;
  if ((S.live.summon || 0) > lastSummon) {   // 작업 앱을 켜서 불려 나옴 → Swift가 창을 보이고 걸어 나오게 함
    lastSummon = S.live.summon;
    post({type: 'summon'});
    const label = S.live.summon_label || '', app = label.includes('.') ? label.split('.')[0].replace(/^./, c => c.toUpperCase()) : label;
    setTimeout(() => say(app ? `${app} 켰구나! ${p ? p.name : '나'}도 같이 할게 🎨` : '불렀어? 왔어!', 4500), 400);
  }
  document.documentElement.style.setProperty('--type', p ? TYPE[p.type] : '#ccc');
  if (m !== mode) {
    document.body.classList.remove('m-' + mode); document.body.classList.add('m-' + m);
    const alert = m === 'warning' || m === 'penalty';
    if (!evolving) say(modeLine(m), alert ? 0 : 4500, alert);
    mode = m; post({type: 'mode', mode: m});
  } else if (m === 'warning' && !evolving) say(modeLine(m), 0, true);

  if (p && prev && prev.line === p.line && !evolving) {
    if (p.stage > prev.stage) {
      evolving = true; document.body.classList.add('evolving'); say('…어라? 몸이 빛나고 있어!', 0);
      setTimeout(() => {
        document.body.classList.remove('evolving'); evolving = false; shownKey = null; draw(); jump();
        say(prev && prev.stage === 0 ? `알이 부화했다! ${p.species[1]}!` : `✨ ${p.species[1]}(으)로 진화했다!`, 6000);
        for (let i = 0; i < 8; i++) setTimeout(() => floatText(pick(['✨', '⭐', '🎉']), '#ffe066'), i * 120);
      }, 3000);
    } else if (p.level > prev.level) { floatText(`Lv.${p.level}!`, '#ffe066'); jump(); say(`레벨 업! Lv.${p.level} 🎉`, 3000); }
    else if (p.level < prev.level) say(`Lv.${p.level}로 떨어졌어… 😢`, 4000, true);
    if (prev.xp - p.xp > 0.05) floatText(`-${(prev.xp - p.xp).toFixed(1)} XP`, '#ff6b7a');
  }
  if (!evolving) draw();
  const emoji = {work: '🎨', break: '🍿', warning: '⚠️', penalty: '💢', idle: '💤', ai: '🧠', paused: '⏸'}[m] || '⭐';
  const STATE_KO = {work: '작업 중', break: '휴식 중', warning: '경고', penalty: '페널티', idle: '자리비움', ai: 'AI 사용 중', paused: '일시정지', neutral: '대기 중'};
  post({type: 'title', text: p ? `${emoji} Lv.${p.level}` : '🥚',
        label: p ? `${p.name} 레벨 ${p.level}, ${STATE_KO[m] || ''}` : '파트너 없음'});
  if (!p && !$('#bubble').classList.contains('show')) say('대시보드에서 파트너를 골라줘! (나를 클릭)', 0);
  prev = p ? {line: p.line, stage: p.stage, level: p.level, xp: p.xp} : null;
}

setInterval(poll, 1500);
setInterval(particle, 900);
setInterval(() => { if (S && S.pet && !evolving && !['warning', 'penalty'].includes(mode) && Math.random() < .5) say(Math.random() < .3 ? statusLine() : modeLine(mode), 4500); }, 22000);
document.body.classList.add('m-neutral');
poll();
</script>
</body>
</html>
